name: Node.js CI

on: [ push ]
jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The supported LTS lines: 22 (maintenance) and 24 (.nvmrc).
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Set Up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable

      - name: Test and Build Codebase
        run: yarn ci
        